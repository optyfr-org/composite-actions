name: Docker login
description: Logs in to an optional additional registry and to Docker Hub

inputs:
  registry:
    description: Additional registry to log in to (e.g. dhi.io)
    required: false
    default: ''
  registry-username:
    description: Username for the additional registry
    required: false
    default: ''
  registry-password:
    description: Password or token for the additional registry
    required: false
    default: ''
  dockerhub-username:
    description: Docker Hub username
    required: true
  dockerhub-password:
    description: Docker Hub password or token
    required: true

runs:
  using: composite
  steps:
    - name: Login to additional registry
      if: ${{ inputs.registry != '' }}
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Login to Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}
