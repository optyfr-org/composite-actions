name: Docker setup
description: Sets up the Docker build environment (QEMU, Buildx) and logs in to registries

inputs:
  setup-qemu:
    description: Whether to set up QEMU
    required: false
    default: 'true'
  setup-buildx:
    description: Whether to set up Docker Buildx
    required: false
    default: 'true'
  registry:
    description: Additional registry to log in to (e.g. dhi.io)
    required: false
    default: ''
  registry-username:
    description: Username for the additional registry
    required: false
    default: ''
  registry-password:
    description: Password or token for the additional registry
    required: false
    default: ''
  dockerhub-username:
    description: Docker Hub username
    required: true
  dockerhub-password:
    description: Docker Hub password or token
    required: true

runs:
  using: composite
  steps:
    - name: Set up QEMU
      if: ${{ inputs.setup-qemu == 'true' }}
      uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4

    - name: Set up Docker Buildx
      if: ${{ inputs.setup-buildx == 'true' }}
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

    - name: Login to additional registry
      if: ${{ inputs.registry != '' }}
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Login to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}
