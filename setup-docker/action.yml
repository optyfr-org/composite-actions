name: Docker setup
description: Sets up the Docker build environment (QEMU, Buildx) and logs in to registries

inputs:
  registry:
    description: Additional registry to log in to (e.g. dhi.io)
    required: false
    default: ''
  registry-username:
    description: Username for the additional registry
    required: false
    default: ''
  registry-password:
    description: Password or token for the additional registry
    required: false
    default: ''
  dockerhub-username:
    description: Docker Hub username
    required: true
  dockerhub-password:
    description: Docker Hub password or token
    required: true

runs:
  using: composite
  steps:
    - name: Set up QEMU
      uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

    - name: Login to additional registry
      if: ${{ inputs.registry != '' }}
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.registry-username }}
        password: ${{ inputs.registry-password }}

    - name: Login to Docker Hub
      uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-password }}
