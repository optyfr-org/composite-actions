name: Upload release asset
description: Uploads files, or files matching a glob, to a GitHub release

inputs:
  tag:
    description: Release tag name
    required: true
  file:
    description: Path or glob of the file(s) to upload
    required: true
  repo:
    description: GitHub repository (owner/repo)
    required: false
    default: ${{ github.repository }}
  token:
    description: GitHub token for authentication
    required: true

runs:
  using: composite
  steps:
    - name: Upload asset to release
      env:
        GH_TOKEN: ${{ inputs.token }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_FILE: ${{ inputs.file }}
        INPUT_REPO: ${{ inputs.repo }}
      shell: bash
      run: |
        shopt -s nullglob globstar
        files=()
        IFS= files=(${INPUT_FILE})
        if [ ${#files[@]} -eq 0 ]; then
          echo "::error::No file matches '${INPUT_FILE}'"
          exit 1
        fi
        printf 'Uploading %s\n' "${files[@]}"
        gh release upload "${INPUT_TAG}" \
          "${files[@]}" \
          --repo "${INPUT_REPO}" \
          --clobber
